[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maskimpute-benchmark"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "anndata>=0.11,<0.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2,<3"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["maskimpute*", "maskimpute_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
